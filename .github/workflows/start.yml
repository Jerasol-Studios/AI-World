name: Start The Grid (Pages + Alpha Boot)

on:
  schedule:
    - cron: '0 23 * * *' # 08:00 JST daily auto-boot
  workflow_dispatch:
    inputs:
      session:
        description: 'Starting session number'
        required: false
        default: '1'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4

  boot-alpha:
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Grid Alpha
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          SESSION: ${{ github.event.inputs.session || '1' }}
        run: |
          gh workflow run grid-alpha.yml -R "${{ github.repository }}" -f session="$SESSION"
