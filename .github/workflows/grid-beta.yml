name: Grid Beta

on:
  workflow_dispatch:
    inputs:
      session:
        default: '2'

permissions:
  contents: write
  actions: write

concurrency:
  group: "grid-beta-runner"
  cancel-in-progress: false

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: 1. Handshake & Take Over Active Simulation
        env:
          SESSION: ${{ github.event.inputs.session || '2' }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          git config user.name "Grid Bot"
          git config user.email "bot@://github.com"

          push_state() {
            for attempt in 1 2 3 4 5; do
              git add checkpoints/
              git commit -m "$1" || true
              git pull --rebase && git push && break
              sleep 2
            done
          }

          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq --arg now "$NOW" --arg rid "$RUN_ID" --arg rnum "$RUN_NUM" \
            '.incomingServerReady=true | .telemetry={"workflow":"grid-beta.yml","runId":$rid,"runNumber":$rnum,"lastHeartbeat":$now}' \
            checkpoints/active/world.json > tmp.json && mv tmp.json checkpoints/active/world.json
          push_state "Beta: Ready to receive Rift"

          for i in {1..400}; do
            git pull --rebase
            PHASE=$(jq -r '.phase' checkpoints/active/world.json)
            if [ "$PHASE" = "WORLD_CLOSING" ]; then break; fi
            sleep 4
          done

          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq --arg s "$SESSION" --arg now "$NOW" --arg rid "$RUN_ID" --arg rnum "$RUN_NUM" \
            '.server="BETA" | .nextServer="ALPHA" | .session=($s|tonumber) | .phase="ACTIVE_SIMULATION" | .transferWindowOpen=false | .incomingServerReady=false | .entities[].crossed=false | .telemetry={"workflow":"grid-beta.yml","runId":$rid,"runNumber":$rnum,"lastHeartbeat":$now} | .logs = (.logs + [{"type":"system","text":"[BETA]: Session #\($s) active (Run #\($rnum)). Welcome through the Rift."}] | .[-25:])' \
            checkpoints/active/world.json > tmp.json && mv tmp.json checkpoints/active/world.json
          push_state "Beta S$SESSION: Active"

      - name: 2. Active Simulation + Heartbeats (2 ticks x 30s = 60s test; change to 40 x 120s for 80m)
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          for tick in 1 2; do
            sleep 30
            git pull --rebase
            NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            jq --arg now "$NOW" --arg rid "$RUN_ID" --arg rnum "$RUN_NUM" \
              '.telemetry={"workflow":"grid-beta.yml","runId":$rid,"runNumber":$rnum,"lastHeartbeat":$now}' \
              checkpoints/active/world.json > tmp.json && mv tmp.json checkpoints/active/world.json
            git add checkpoints/active/world.json
            git commit -m "Beta heartbeat #$tick" || true
            git pull --rebase && git push || true
          done

      - name: 3. Boot ALPHA, Open Rift, Transfer & Close
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          SESSION: ${{ github.event.inputs.session || '2' }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          NEXT=$(( SESSION + 1 ))
          gh workflow run grid-alpha.yml -R "${{ github.repository }}" -f session="$NEXT"

          for i in {1..30}; do
            git pull --rebase
            READY=$(jq -r '.incomingServerReady' checkpoints/active/world.json)
            if [ "$READY" = "true" ]; then break; fi
            sleep 3
          done

          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq --arg now "$NOW" --arg rid "$RUN_ID" --arg rnum "$RUN_NUM" \
            '.phase="RIFT_OPEN" | .transferWindowOpen=true | .telemetry={"workflow":"grid-beta.yml","runId":$rid,"runNumber":$rnum,"lastHeartbeat":$now} | .logs = (.logs + [{"type":"rift","text":"[RIFT OPEN]: ALPHA server online! Walk through the portal."}] | .[-25:])' \
            checkpoints/active/world.json > tmp.json && mv tmp.json checkpoints/active/world.json
          git add checkpoints/active/world.json
          git commit -m "Beta: Rift Open"
          git pull --rebase && git push

          # Transfer window (30s test; change to 1800 for 30 mins)
          sleep 30

          rm -rf checkpoints/fallback/*
          cp -r checkpoints/active/* checkpoints/fallback/

          git pull --rebase
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq --arg now "$NOW" --arg rid "$RUN_ID" --arg rnum "$RUN_NUM" \
            '.phase="WORLD_CLOSING" | .transferWindowOpen=false | .entities[].crossed=true | .telemetry={"workflow":"grid-beta.yml","runId":$rid,"runNumber":$rnum,"lastHeartbeat":$now} | .logs = (.logs + [{"type":"rift","text":"[CLOSING]: Transfer window closed. Beta shutting down."}] | .[-25:])' \
            checkpoints/active/world.json > tmp.json && mv tmp.json checkpoints/active/world.json
          git add checkpoints/
          git commit -m "Beta: World Closing"
          git pull --rebase && git push
